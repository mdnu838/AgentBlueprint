[project]
name = "agentblueprint-eval"
version = "0.1.0"
description = "Evaluation and prompt optimization tools for AgentBlueprint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "agentblueprint-core",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentblueprint_eval"]
