[project]
name = "agentblueprint-core"
version = "0.1.0"
description = "Core runtime for AgentBlueprint multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.7.0"]
vector = ["chromadb>=0.4.0", "pinecone>=3.0.0", "qdrant-client>=1.7.0"]
db = ["sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "chromadb>=0.4.0",
    "pinecone>=3.0.0",
    "qdrant-client>=1.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentblueprint_core"]
