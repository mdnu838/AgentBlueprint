[project]
name = "agentblueprint-api"
version = "0.1.0"
description = "FastAPI backend and distributed execution for AgentBlueprint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentblueprint-core",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "temporalio>=1.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentblueprint_api"]
